name: Update Contributor Leaderboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" 

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run:  bun install

      - name: Run leaderboard script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun generate

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add src/data/leaderboard.json
          git commit -m "chore(leaderboard): update contribution leaderboard with new metrics" || echo "No changes to commit"
          git push

