[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

  SECRETS_SCAN_OMIT_KEYS = "TINA_TOKEN,NEXT_PUBLIC_TINA_CLIENT_ID,NEXT_PUBLIC_GA_MEASUREMENT_ID,NEXT_PUBLIC_RAZORPAY_KEY_ID,NEXT_PUBLIC_RECAPTCHA_SITE_KEY,NEXT_PUBLIC_API_BASE_URL,NEXT_PUBLIC_CDN_URL,NEXT_PUBLIC_APP_URL"

# Netlify Next.js plugin for proper routing and static asset handling
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[build.processing.skip]]
  for = "secret-scanning"
  paths = ["**/*"]
  patterns = ["NEXT_PUBLIC_*"]

# Force HTTPS
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Redirect www to non-www
[[redirects]]
  from = "https://www.mulearn.org/*"
  to = "https://mulearn.org/:splat"
  status = 301
  force = true
